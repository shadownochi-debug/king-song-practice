<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3ede2"><link rel="manifest" href="manifest.json"><title>松贊干布吉祥頌｜每日練習</title><style>body{margin:0;background:#f3ede2;color:#302b27;font-family:-apple-system,BlinkMacSystemFont,"Noto Serif TC","PingFang TC","Songti TC",serif}.top{text-align:center;padding:18px}.title{font-size:20px}.sub{font-size:12px;color:#86796b;margin-top:4px}.toolbar{display:flex;justify-content:center;gap:8px;margin-top:10px}.toolbar button,.nav button{border:0;border-radius:999px;padding:9px 12px;background:#e7dccb;color:#302b27}.toolbar button{font-size:12px}#book{padding:10px 14px;min-height:78vh;display:flex;justify-content:center;touch-action:pan-y}.page{width:min(780px,100%);background:#fffdf8;border-radius:24px;box-shadow:0 16px 40px #34281e1c;padding:26px 22px;min-height:70vh;display:flex;flex-direction:column}.badge{font:700 12px -apple-system,BlinkMacSystemFont,sans-serif;color:#8e6b4f;letter-spacing:.12em}.date{font-size:28px;margin-top:7px}.time{font:12px -apple-system,BlinkMacSystemFont,sans-serif;color:#86796b;margin:4px 0 20px}.line{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #e8dfd1}.en{font-size:21px;line-height:1.6}.zh{font-size:16px;line-height:1.75;color:#6f655c;margin-top:7px}.nav{display:flex;gap:8px;margin-top:auto;padding-top:16px}.nav button{flex:1;font-size:12px}.nav .main{background:#8e6b4f;color:#fff}.counter{text-align:center;color:#86796b;font-size:11px;margin-top:8px}@media(max-width:520px){.page{padding:23px 18px}.en{font-size:20px}.date{font-size:26px}}</style></head><body><div class="top"><div class="title">松贊干布吉祥頌</div><div class="sub">32 天英文歌詞・中文・發音對照</div><div class="toolbar"><button onclick="goToday()">今天</button><button onclick="fontSize()">字級</button><button onclick="toggleDark()">夜間</button></div></div><div id="book"></div><script>let D=[],i=0,large=false;fetch('data.json').then(r=>r.json()).then(x=>{D=x;goToday()});function todayIndex(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),s=new Date(n.getFullYear(),8,14);return Math.max(0,Math.min(31,Math.round((t-s)/86400000)))}function goToday(){i=todayIndex();render()}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){const d=D[i];document.getElementById('book').innerHTML='<article class="page"><div class="badge">DAY '+d.day+' · '+d.date+'</div><div class="date">'+d.date+'</div><div class="time">'+d.time+'</div>'+d.lines.map(x=>'<div class="line"><div class="en">'+esc(x[0])+'</div><div class="zh">'+esc(x[1])+'</div></div>').join('')+(d.vocab.length?'<div><b style="color:#8e6b4f">發音與詞義</b>'+d.vocab.map(v=>'<div style="padding:8px 0;border-bottom:1px dashed #e8dfd1"><b>'+esc(v[0])+'</b> '+esc(v[1])+'<br><span style="font-size:13px;color:#86796b">'+esc(v[2])+'｜'+esc(v[3])+'</span></div>').join('')+'</div>':'')+'<div class="nav"><button onclick="prev()">◀ 上一天</button><button class="main" onclick="speakDay()">🔊 朗讀本日英文</button><button onclick="next()">下一天 ▶</button></div><div class="counter">'+(i+1)+' / '+D.length+'</div></article>'}function prev(){i=(i+31)%32;render()}function next(){i=(i+1)%32;render()}function fontSize(){document.querySelector('.page').style.fontSize=document.querySelector('.page').style.fontSize==='18px'?'':'18px'}function toggleDark(){document.body.style.background=document.body.style.background==='#1d1b19'?'#f3ede2':'#1d1b19';document.body.style.color=document.body.style.color==='#eee7dd'?'#302b27':'#eee7dd'}function speakDay(){const u=new SpeechSynthesisUtterance(D[i].lines.map(x=>x[0]).join(' '));u.lang='en-US';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}let sx=0;document.getElementById('book').addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.getElementById('book').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>55){dx<0?next():prev()}},{passive:true});</script></body></html>
